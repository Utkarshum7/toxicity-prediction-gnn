name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # requirements.txt selects the hash-pinned CPU-only PyTorch wheel on Linux.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Syntax check
        run: python -m compileall -q app.py train.py predict.py src tests

      - name: Run tests
        run: python -m pytest -q
